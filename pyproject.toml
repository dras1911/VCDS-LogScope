[project]
name = "vcds-logscope"
version = "1.0.0"
description = "Czytelna wizualizacja logów z programu VCDS (VAG-COM) — wykres nakładany, tabela z heatmapą, porównanie logów"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6", "pillow>=10"]

[project.scripts]
vcds-logscope = "vcds_viewer.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vcds_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
